name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the tree-sitter CLI
        run: npm install -g tree-sitter-cli@0.27.0

      - name: Check the manifest and language config parse
        run: |
          python3 - <<'PY'
          import tomllib
          m = tomllib.load(open("extension.toml", "rb"))
          for key in ("id", "name", "version", "schema_version", "description", "repository"):
              assert key in m, f"extension.toml is missing {key}"
          assert "holo" in m["grammars"], "extension.toml declares no holo grammar"
          c = tomllib.load(open("languages/holo/config.toml", "rb"))
          assert c["name"] == "HOLO" and c["grammar"] == "holo"
          print("manifest and config are valid")
          PY

      # Pinning a commit that was never pushed breaks the extension at
      # install time. Catch it here instead.
      - name: Check the pinned grammar commit exists on the remote
        run: |
          repo=$(python3 -c "import tomllib;print(tomllib.load(open('extension.toml','rb'))['grammars']['holo']['repository'])")
          rev=$(python3 -c "import tomllib;print(tomllib.load(open('extension.toml','rb'))['grammars']['holo']['rev'])")
          git init -q grammar && cd grammar
          git remote add origin "$repo"
          git fetch -q --depth 1 origin "$rev" || { echo "pinned rev $rev is not on $repo"; exit 1; }
          git checkout -q "$rev"
          echo "grammar $rev is present on the remote"

      # A query naming a node the grammar no longer has fails only at
      # runtime in Zed.
      - name: Check every query against that grammar
        run: |
          cd grammar
          for q in ../languages/holo/*.scm; do
            if err=$(tree-sitter query "$q" ../examples/kitchen-sink.holo 2>&1 >/dev/null); then
              echo "  ok       $(basename "$q")"
            else
              echo "  FAILED   $(basename "$q")"; echo "$err" | head -5; exit 1
            fi
          done
